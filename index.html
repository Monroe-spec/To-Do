<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <script src="index.js" defer></script>
    <h1> Welcome to Your To-Do Lists</h1>
    <h2> Here you can add, edit, and complete tasks and goals.</h2>
</head>
<body>
    <div class="container">
        <div class="input">
            <input type="text" id="label" placeholder="Enter a task">
            <input type="text" id="type" placeholder="task or goal">
            <br>
            <button onclick="add()" id="add">Add</button>
        </div>
        
        <div class="tasks">
            <ul id="tasks"><span>Tasks</span>
            </ul>
        </div>
        
        <div class="goals">
            <ul id="goals"><span>Goals</span>
            </ul>
        </div>
        
        <div class="tasks">
            <ul id="task"><span>Completed Tasks</span>
            </ul>
        </div>
       
        <div class="completed-goals">
            <ul id="completed-goals"> <span>Completed Goals</span>
            </ul>
    </div>
</body>




</html>
